name: Build

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Test KodaCore
        working-directory: KodaCore
        run: swift test

      - name: Build unsigned app
        run: |
          xcodebuild -project Koda.xcodeproj -scheme Koda -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      # An unsigned .ipa: AltStore, SideStore and Sideloadly sign it with the installer's own Apple ID.
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Koda.app Payload/
          zip -qry Koda.ipa Payload
          ls -lh Koda.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: Koda-${{ github.sha }}
          path: Koda.ipa
          retention-days: 30
